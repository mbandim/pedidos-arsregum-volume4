<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido Ars Regum Vol 4</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }
    h1 { text-align: center; margin-bottom: 30px; color: #333; font-size: 1.8em; }
    label { display: block; margin-top: 15px; font-weight: 600; color: #555; }
    input { width: 100%; padding: 10px 15px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 1em; }
    input:focus { border-color: #667eea; outline: none; box-shadow: 0 0 0 3px rgba(102,126,234,0.2); }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    #endereco { margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 8px; }
    #endereco input { background: #f0f0f0; cursor: default; }
    #totals { margin-top: 20px; padding: 20px; background: #f0f8ff; border-radius: 12px; border: 1px solid #b3d9ff; }
    #totals p { margin: 5px 0; font-size: 1.1em; }
    #totals .pix-box {
      margin-top: 15px;
      padding: 15px;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 8px;
      text-align: center;
    }
    #totals .pix-box strong { color: #856404; }
    #totals .pix-key {
      font-family: monospace;
      background: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #ffc107;
      color: #333;
      font-weight: bold;
    }
    #submitBtn { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Pedido Ars Regum Vol 4</h1>
    <form id="orderForm">
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" required placeholder="Seu nome">

      <label for="email">E-mail:</label>
      <input type="email" id="email" required placeholder="seu@email.com">

      <label for="whatsapp">WhatsApp (com DDD):</label>
      <input type="text" id="whatsapp" required placeholder="(12) 99999-9999">

      <label for="cep">CEP:</label>
      <input type="text" id="cep" required maxlength="9" placeholder="00000-000">

      <div id="endereco" style="display:none;">
        <label>Logradouro:</label>
        <input type="text" id="logradouro" readonly>
        <label>Bairro:</label>
        <input type="text" id="bairro" readonly>
        <label>Cidade/UF:</label>
        <input type="text" id="cidade" readonly>
      </div>

      <label for="quantidade">Quantidade de exemplares:</label>
      <input type="number" id="quantidade" min="1" value="1" required>

      <button type="button" id="calcularBtn">Calcular valor total (incluindo o frete)</button>

      <div id="totals" style="display:none;">
        <p><strong>Frete:</strong> R$ <span id="freteValor">0,00</span></p>
        <p><strong>Total (exemplares + frete):</strong> R$ <span id="totalValor">0,00</span></p>
        <div class="pix-box">
          <strong>💳 Pagamento via PIX</strong>
          <p>Chave: <span class="pix-key">contato@qcsp333.com.br</span></p>
          <p>Após o pagamento, envie o comprovante pelo WhatsApp abaixo.</p>
        </div>
        <button type="submit" id="submitBtn" style="display:none;">✅ Enviar pedido pelo WhatsApp</button>
      </div>
    </form>
  </div>

  <script>
    const cepInput = document.getElementById('cep');
    const enderecoDiv = document.getElementById('endereco');
    const logradouroInput = document.getElementById('logradouro');
    const bairroInput = document.getElementById('bairro');
    const cidadeInput = document.getElementById('cidade');
    const calcularBtn = document.getElementById('calcularBtn');
    const totalsDiv = document.getElementById('totals');
    const freteValor = document.getElementById('freteValor');
    const totalValor = document.getElementById('totalValor');
    const submitBtn = document.getElementById('submitBtn');
    const form = document.getElementById('orderForm');

    const PRECO_UNITARIO = 59.90; // exemplo, pode ajustar

    // Máscara CEP
    cepInput.addEventListener('input', function() {
      let value = this.value.replace(/\D/g, '');
      if (value.length > 5) {
        value = value.substring(0,5) + '-' + value.substring(5,8);
      }
      this.value = value;
    });

    // Busca CEP
    cepInput.addEventListener('blur', async function() {
      const cep = this.value.replace(/\D/g, '');
      if (cep.length !== 8) return;
      try {
        const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const data = await response.json();
        if (!data.erro) {
          logradouroInput.value = `${data.logradouro}, ${data.bairro}`;
          bairroInput.value = data.bairro;
          cidadeInput.value = `${data.localidade} - ${data.uf}`;
          enderecoDiv.style.display = 'block';
        } else {
          alert('CEP não encontrado.');
          enderecoDiv.style.display = 'none';
        }
      } catch (e) {
        alert('Erro ao consultar CEP.');
      }
    });

    // Calcular totais
    calcularBtn.addEventListener('click', function() {
      const qtd = parseInt(document.getElementById('quantidade').value) || 1;
      const pesoGramas = qtd * 600;
      let frete = 0;
      if (qtd < 3) {
        // Cálculo fictício: R$10 por kg, mínimo R$10, arredondado para múltiplo de 5 superior
        let base = Math.max(10, (pesoGramas / 1000) * 10);
        frete = Math.ceil(base / 5) * 5;
      } else {
        frete = 0; // frete grátis
      }
      const totalExemplares = qtd * PRECO_UNITARIO;
      const total = totalExemplares + frete;

      freteValor.textContent = frete.toFixed(2).replace('.', ',');
      totalValor.textContent = total.toFixed(2).replace('.', ',');

      totalsDiv.style.display = 'block';
      submitBtn.style.display = 'block';
    });

    // Envio do formulário
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const whatsapp = document.getElementById('whatsapp').value.trim();
      const cep = document.getElementById('cep').value.trim();
      const quantidade = parseInt(document.getElementById('quantidade').value);
      const frete = document.getElementById('freteValor').textContent;
      const total = document.getElementById('totalValor').textContent;

      // Enviar para Sheet Monkey (síncrono via fetch)
      const data = {
        nome: nome,
        email: email,
        whatsapp: whatsapp,
        cep: cep,
        quantidade: quantidade,
        frete: frete,
        total: total
      };

      try {
        await fetch('https://api.sheetmonkey.io/form/jPMBQbTa6pU2ZF2wRDQcuX', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } catch (err) {
        console.error('Erro ao enviar para Sheet Monkey:', err);
        // Continua mesmo com erro
      }

      // Montar mensagem para WhatsApp
      const telefone = '5512991513554'; // (12) 99151-3554
      const mensagem = `Olá! Fiz um pedido do Ars Regum Vol 4.\n\nNome: ${nome}\nE-mail: ${email}\nWhatsApp: ${whatsapp}\nCEP: ${cep}\nQuantidade: ${quantidade} exemplar(es)\nFrete: R$ ${frete}\nTotal: R$ ${total}\n\nPagamento via PIX para contato@qcsp333.com.br - Comprovante anexado.`;
      const url = `https://wa.me/${telefone}?text=${encodeURIComponent(mensagem)}`;
      window.open(url, '_blank');
    });
  </script>
</body>
</html>
