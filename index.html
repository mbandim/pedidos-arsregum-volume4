<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário de Pedido - Ars Regum Vol 4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
  .container { background: white; border-radius: 20px; padding: 40px; max-width: 600px; width: 100%; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
  .container h1 { text-align: center; color: #4a4a4a; margin-bottom: 30px; font-size: 28px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
  .form-group input, .form-group select { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: border 0.3s; }
  .form-group input:focus, .form-group select:focus { border-color: #667eea; outline: none; }
  .form-row { display: flex; gap: 20px; }
  .form-row .form-group { flex: 1; }
  .btn-calc, .btn-submit { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 18px; font-weight: 600; cursor: pointer; transition: transform 0.2s, opacity 0.3s; }
  .btn-calc { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin-bottom: 15px; }
  .btn-calc:hover { transform: scale(1.02); opacity: 0.9; }
  .btn-submit { background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); color: white; }
  .btn-submit:hover { transform: scale(1.02); opacity: 0.9; }
  .totals { background: #f7f7f7; padding: 20px; border-radius: 10px; margin: 20px 0; text-align: center; }
  .totals p { margin: 5px 0; font-size: 16px; color: #333; }
  .totals .total-final { font-size: 24px; font-weight: 700; color: #4a4a4a; }
</style>
</head>
<body>
<div class="container">
  <h1>Pedido Ars Regum Vol 4</h1>
  <form id="orderForm">
    <div class="form-group">
      <label for="nome">Nome Completo</label>
      <input type="text" id="nome" name="nome" required>
    </div>
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="telefone">Telefone (WhatsApp)</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
    </div>
    <div class="form-group">
      <label for="cep">CEP</label>
      <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="logradouro">Logradouro</label>
        <input type="text" id="logradouro" name="logradouro" readonly>
      </div>
      <div class="form-group">
        <label for="numero">Número</label>
        <input type="text" id="numero" name="numero" required>
      </div>
    </div>
    <div class="form-group">
      <label for="complemento">Complemento</label>
      <input type="text" id="complemento" name="complemento">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade" readonly>
      </div>
      <div class="form-group">
        <label for="estado">Estado</label>
        <input type="text" id="estado" name="estado" readonly>
      </div>
    </div>
    <div class="form-group">
      <label for="quantidade">Quantidade de Exemplares</label>
      <input type="number" id="quantidade" name="quantidade" min="1" value="1" required>
    </div>
    <div class="totals" id="totals">
      <p>Valor dos exemplares: R$ <span id="subtotal">120,00</span></p>
      <p>Frete: R$ <span id="frete">0,00</span></p>
      <p class="total-final">Total: R$ <span id="total">120,00</span></p>
    </div>
    <button type="button" class="btn-calc" onclick="calcularFrete()">Calcular valor total (incluindo o frete)</button>
    <button type="submit" class="btn-submit">Enviar Pedido pelo WhatsApp</button>
  </form>
</div>

<script>
// Variável global para armazenar o estado de destino
let estadoDestino = '';

// ViaCEP - Busca endereço ao digitar 8 dígitos ou perder o foco
document.getElementById('cep').addEventListener('input', function() {
  let cep = this.value.replace(/\D/g, '');
  if (cep.length === 8) {
    buscarCep(cep);
  }
});

document.getElementById('cep').addEventListener('blur', function() {
  let cep = this.value.replace(/\D/g, '');
  if (cep.length === 8) {
    buscarCep(cep);
  }
});

function buscarCep(cep) {
  fetch(`https://viacep.com.br/ws/${cep}/json/`)
    .then(response => response.json())
    .then(data => {
      if (!data.erro) {
        document.getElementById('logradouro').value = data.logradouro;
        document.getElementById('cidade').value = data.localidade;
        document.getElementById('estado').value = data.uf;
        estadoDestino = data.uf;
        // Recalcular frete se já houver quantidade
        if (document.getElementById('quantidade').value) {
          calcularFrete();
        }
      } else {
        alert('CEP não encontrado.');
      }
    })
    .catch(() => alert('Erro ao buscar CEP.'));
}

// Cálculo de frete
function calcularFrete() {
  const quantidade = parseInt(document.getElementById('quantidade').value) || 0;
  const precoUnitario = 120.00;
  const subtotal = quantidade * precoUnitario;
  
  let frete = 0;
  if (quantidade >= 3) {
    frete = 0;
  } else {
    const pesoTotal = quantidade * 0.6; // kg
    const estado = estadoDestino;
    
    // Tabela de frete por estado e peso
    let baseFrete = 0;
    if (pesoTotal <= 1) {
      if (estado === 'SP') {
        baseFrete = 13.50;
      } else if (['RJ','MG','ES','PR','SC','RS'].includes(estado)) {
        baseFrete = 17.20;
      } else {
        baseFrete = 21.50;
      }
    } else {
      if (estado === 'SP') {
        baseFrete = 16.80;
      } else if (['RJ','MG','ES','PR','SC','RS'].includes(estado)) {
        baseFrete = 22.40;
      } else {
        baseFrete = 27.90;
      }
    }
    // Arredondamento para múltiplo de 5 superior
    frete = Math.ceil(baseFrete / 5) * 5;
  }
  
  const total = subtotal + frete;
  
  document.getElementById('subtotal').textContent = subtotal.toFixed(2).replace('.', ',');
  document.getElementById('frete').textContent = frete.toFixed(2).replace('.', ',');
  document.getElementById('total').textContent = total.toFixed(2).replace('.', ',');
  
  // Armazenar frete para uso no envio
  window.freteCalculado = frete;
}

// Envio do formulário
document.getElementById('orderForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const nome = document.getElementById('nome').value;
  const email = document.getElementById('email').value;
  const telefone = document.getElementById('telefone').value;
  const cep = document.getElementById('cep').value;
  const logradouro = document.getElementById('logradouro').value;
  const numero = document.getElementById('numero').value;
  const complemento = document.getElementById('complemento').value;
  const cidade = document.getElementById('cidade').value;
  const estado = document.getElementById('estado').value;
  const quantidade = parseInt(document.getElementById('quantidade').value);
  const subtotal = quantidade * 120.00;
  const frete = window.freteCalculado || 0;
  const total = subtotal + frete;
  
  // Dados para Sheet Monkey
  const dadosSheet = {
    nome,
    email,
    telefone,
    cep,
    logradouro,
    numero,
    complemento,
    cidade,
    estado,
    quantidade,
    subtotal: subtotal.toFixed(2),
    frete: frete.toFixed(2),
    total: total.toFixed(2)
  };
  
  // Enviar para Sheet Monkey
  fetch('https://api.sheetmonkey.io/form/jPMBQbTa6pU2ZF2wRDQcuX', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(dadosSheet)
  }).then(() => {
    // Após sucesso, abrir WhatsApp
    const mensagem = `Olá! Gostaria de fazer um pedido do Ars Regum Vol 4.\n\n*Dados do Cliente*\nNome: ${nome}\nE-mail: ${email}\nTelefone: ${telefone}\n\n*Endereço de Entrega*\nCEP: ${cep}\nLogradouro: ${logradouro}, ${numero}${complemento ? ' - ' + complemento : ''}\nCidade: ${cidade} - ${estado}\n\n*Pedido*\nQuantidade: ${quantidade}\nValor dos exemplares: R$ ${subtotal.toFixed(2)}\nFrete: R$ ${frete.toFixed(2)}\nTotal: R$ ${total.toFixed(2)}\n\n*Pagamento*\nPIX: contato@qcsp333.gov.br\nValor: R$ ${total.toFixed(2)}`;
    const urlWhatsApp = `https://wa.me/5512991513554?text=${encodeURIComponent(mensagem)}`;
    window.open(urlWhatsApp, '_blank');
  }).catch(err => {
    alert('Erro ao registrar pedido. Tente novamente.');
    console.error(err);
  });
});
</script>
</body>
</html>
