<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário de Pedido - Ars Regum Vol 4</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: white; border-radius: 20px; padding: 40px; max-width: 900px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    h1 { text-align: center; color: #333; margin-bottom: 30px; font-weight: 700; font-size: 28px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .full-width { grid-column: span 2; }
    .form-group { display: flex; flex-direction: column; }
    label { font-weight: 600; margin-bottom: 5px; color: #444; }
    label span { color: #e74c3c; }
    input, select { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; transition: border-color 0.3s; }
    input:focus, select:focus { border-color: #667eea; outline: none; }
    input[readonly] { background: #f5f5f5; }
    .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 18px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; width: 100%; margin-top: 20px; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
    #totals, #btnWhatsApp { display: none; text-align: center; margin-top: 20px; }
    #totals { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); padding: 20px; border-radius: 10px; }
    #totals h3 { color: #2c3e50; margin-bottom: 10px; }
    #totals p { font-size: 16px; margin: 5px 0; }
    #totals .pix { font-weight: 700; color: #27ae60; background: #d5f5e3; padding: 5px 10px; border-radius: 5px; display: inline-block; margin-top: 10px; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; } }
</style>
</head>
<body>
<div class="container">
    <h1>Pedido Ars Regum Vol 4 - Restauração do Layout Premium</h1>
    <form id="orderForm">
        <div class="form-grid">
            <div class="form-group full-width">
                <label for="nome">Nome completo <span>*</span></label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group full-width">
                <label for="email">E-mail <span>*</span></label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="telefone">Telefone (com DDD) <span>*</span></label>
                <input type="tel" id="telefone" name="telefone" placeholder="(XX) XXXXX-XXXX" required>
            </div>
            <div class="form-group">
                <label for="cep">CEP <span>*</span></label>
                <input type="text" id="cep" name="cep" placeholder="XXXXX-XXX" required>
            </div>
            <div class="form-group full-width">
                <label for="logradouro">Logradouro (Rua, Av. etc) <span>*</span></label>
                <input type="text" id="logradouro" name="logradouro" readonly required>
            </div>
            <div class="form-group">
                <label for="numero">Número <span>*</span></label>
                <input type="text" id="numero" name="numero" required>
            </div>
            <div class="form-group">
                <label for="complemento">Complemento [Opcional]</label>
                <input type="text" id="complemento" name="complemento">
            </div>
            <div class="form-group">
                <label for="cidade">Cidade <span>*</span></label>
                <input type="text" id="cidade" name="cidade" readonly required>
            </div>
            <div class="form-group">
                <label for="estado">Estado (Sigla) <span>*</span></label>
                <input type="text" id="estado" name="estado" readonly required>
            </div>
            <div class="form-group">
                <label for="loja">Nome da Loja [Opcional]</label>
                <input type="text" id="loja" name="loja">
            </div>
            <div class="form-group">
                <label for="numeroLoja">Número da Loja [Opcional]</label>
                <input type="text" id="numeroLoja" name="numeroLoja">
            </div>
            <div class="form-group">
                <label for="potencia">Potência [Opcional]</label>
                <input type="text" id="potencia" name="potencia">
            </div>
            <div class="form-group full-width">
                <label for="quantidade">Quantidade de exemplares do volume 4 <span>*</span> (R$ 100,00 cada)</label>
                <input type="number" id="quantidade" name="quantidade" min="1" required>
            </div>
        </div>
        <button type="button" id="btnCalcular" class="btn">Calcular valor total (incluindo o frete)</button>
        <div id="totals">
            <h3>Resumo do Pedido</h3>
            <p id="subtotal"></p>
            <p id="frete"></p>
            <p id="total"></p>
            <p class="pix">Faça o PIX para a chave: <strong>contato@qcsp333.com.br</strong></p>
        </div>
        <button type="button" id="btnWhatsApp" class="btn">Enviar pedido pelo WhatsApp</button>
    </form>
</div>

<script>
    // Masks
    function mascaraTelefone(input) {
        let v = input.value.replace(/\D/g, '');
        v = v.substring(0, 11);
        if (v.length > 2) v = '(' + v.substring(0,2) + ') ' + v.substring(2);
        if (v.length > 9) v = v.substring(0,9) + '-' + v.substring(9);
        input.value = v;
    }

    function mascaraCEP(input) {
        let v = input.value.replace(/\D/g, '');
        v = v.substring(0, 8);
        if (v.length > 5) v = v.substring(0,5) + '-' + v.substring(5);
        input.value = v;
    }

    document.getElementById('telefone').addEventListener('input', function() { mascaraTelefone(this); });
    document.getElementById('cep').addEventListener('input', function() { mascaraCEP(this); });

    // ViaCEP
    function buscarCEP() {
        const cep = document.getElementById('cep').value.replace(/\D/g, '');
        if (cep.length !== 8) return;
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
            .then(res => res.json())
            .then(data => {
                if (data.erro) {
                    alert('CEP não encontrado.');
                    document.getElementById('logradouro').value = '';
                    document.getElementById('cidade').value = '';
                    document.getElementById('estado').value = '';
                    return;
                }
                document.getElementById('logradouro').value = data.logradouro;
                document.getElementById('cidade').value = data.localidade;
                document.getElementById('estado').value = data.uf;
            })
            .catch(err => console.error('Erro ao buscar CEP:', err));
    }

    document.getElementById('cep').addEventListener('blur', buscarCEP);

    // Calculate
    document.getElementById('btnCalcular').addEventListener('click', function() {
        const qty = parseInt(document.getElementById('quantidade').value);
        if (!qty || qty < 1) {
            alert('Informe a quantidade desejada.');
            return;
        }
        const estado = document.getElementById('estado').value.toUpperCase();
        if (!estado) {
            alert('Preencha o CEP para definir o estado de destino.');
            return;
        }

        const precoLivro = 100;
        const subtotal = qty * precoLivro;
        let frete = 0;
        if (qty >= 3) {
            frete = 0;
        } else {
            const pesoTotal = qty * 0.6; // kg
            let taxa1, taxa2;
            if (estado === 'SP') {
                taxa1 = 13.50; taxa2 = 16.80;
            } else if (['RS','SC','PR','MG','ES','RJ'].includes(estado)) {
                taxa1 = 17.20; taxa2 = 22.40;
            } else {
                taxa1 = 21.50; taxa2 = 27.90;
            }
            frete = pesoTotal <= 1 ? taxa1 : taxa2;
            frete = Math.ceil(frete / 5) * 5; // arredondar para múltiplo de 5 superior
        }

        const total = subtotal + frete;

        document.getElementById('subtotal').innerText = `Subtotal (${qty} livros): R$ ${subtotal.toFixed(2)}`;
        document.getElementById('frete').innerText = `Frete: R$ ${frete.toFixed(2)}`;
        document.getElementById('total').innerText = `Total: R$ ${total.toFixed(2)}`;

        document.getElementById('totals').style.display = 'block';
        document.getElementById('btnWhatsApp').style.display = 'block';
    });

    // WhatsApp submit
    document.getElementById('btnWhatsApp').addEventListener('click', async function() {
        const form = document.getElementById('orderForm');
        const nome = document.getElementById('nome').value;
        const email = document.getElementById('email').value;
        const telefone = document.getElementById('telefone').value;
        const cep = document.getElementById('cep').value;
        const logradouro = document.getElementById('logradouro').value;
        const numero = document.getElementById('numero').value;
        const complemento = document.getElementById('complemento').value;
        const cidade = document.getElementById('cidade').value;
        const estado = document.getElementById('estado').value;
        const loja = document.getElementById('loja').value;
        const numeroLoja = document.getElementById('numeroLoja').value;
        const potencia = document.getElementById('potencia').value;
        const quantidade = document.getElementById('quantidade').value;
        const subtotal = document.getElementById('subtotal').innerText;
        const frete = document.getElementById('frete').innerText;
        const total = document.getElementById('total').innerText;

        // Enviar para Sheet Monkey
        const data = {
            nome, email, telefone, cep, logradouro, numero, complemento, cidade, estado,
            loja, numeroLoja, potencia, quantidade, subtotal, frete, total
        };

        try {
            await fetch('https://api.sheetmonkey.io/form/jPMBQbTa6pU2ZF2wRDQcuX', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        } catch (e) {
            console.error('Erro ao enviar para Sheet Monkey:', e);
        }

        // Montar mensagem WhatsApp
        const mensagem = `Olá! Gostaria de fazer um pedido do Ars Regum Vol 4.\n\n` +
            `*Nome:* ${nome}\n` +
            `*E-mail:* ${email}\n` +
            `*Telefone:* ${telefone}\n` +
            `*Endereço:* ${logradouro}, ${numero}${complemento ? ', ' + complemento : ''} - ${cidade}/${estado} - CEP ${cep}\n` +
            `*Loja:* ${loja || 'Não informado'} ${numeroLoja ? 'Nº ' + numeroLoja : ''} - Potência: ${potencia || 'Não informada'}\n` +
            `*Quantidade:* ${quantidade} exemplar(es)\n` +
            `*Subtotal:* ${subtotal}\n` +
            `*Frete:* ${frete}\n` +
            `*Total:* ${total}\n\n` +
            `Pagamento via PIX para a chave: *contato@qcsp333.com.br*\n` +
            `Após o pagamento, enviar comprovante para confirmar o pedido.`;

        const url = `https://wa.me/5512991513554?text=${encodeURIComponent(mensagem)}`;
        window.open(url, '_blank');
    });
</script>
</body>
</html>
