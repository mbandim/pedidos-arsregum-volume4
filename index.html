<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Pedido - Ars Regum Vol 4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); max-width: 500px; width: 100%; padding: 30px; transition: 0.3s; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 1.8rem; border-bottom: 3px solid #3498db; padding-bottom: 10px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; color: #34495e; }
    input, textarea { width: 100%; padding: 10px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; transition: border-color 0.3s; }
    input:focus, textarea:focus { outline: none; border-color: #3498db; }
    textarea { resize: vertical; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; min-width: 120px; }
    .btn-primary { background: #3498db; }
    .btn-primary:hover { background: #2980b9; }
    .btn-success { background: #27ae60; }
    .btn-success:hover { background: #1e8449; }
    .btn-info { background: #16a085; }
    .btn-info:hover { background: #117a65; }
    #resultado { margin-top: 20px; padding: 15px; background: #f9f9f9; border-radius: 8px; border-left: 5px solid #3498db; }
    #resultado p { margin: 5px 0; }
    .pix-info { margin-top: 15px; padding: 10px; background: #ffeaa7; border-radius: 8px; text-align: center; }
    .pix-info p { font-size: 0.9rem; }
    .error { color: #e74c3c; font-size: 0.9rem; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pedido - Ars Regum Vol 4</h1>
    <form id="pedidoForm">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" required>
      </div>
      <div class="form-group">
        <label for="endereco">Endereço Completo</label>
        <textarea id="endereco" name="endereco" rows="3" required></textarea>
      </div>
      <div class="form-group">
        <label for="telefone">Telefone (WhatsApp)</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(12) 99151-3554" required>
      </div>
      <div class="form-group">
        <label for="quantidade">Quantidade de Livros</label>
        <input type="number" id="quantidade" name="quantidade" min="1" value="1" required>
      </div>
      <div class="form-group">
        <label for="frete">Valor do Frete (R$)</label>
        <input type="number" id="frete" name="frete" step="0.01" min="0" value="0" required>
      </div>
      <div class="btn-group">
        <button type="button" class="btn btn-primary" id="btnCalcular">Calcular Total</button>
        <button type="button" class="btn btn-success" id="btnWhatsApp">Enviar WhatsApp</button>
        <button type="button" class="btn btn-info" id="btnPix">Chave PIX</button>
      </div>
    </form>

    <div id="resultado">
      <p id="display">Preencha os dados e calcule o total.</p>
    </div>

    <div class="pix-info" id="pixInfo" style="display: none;">
      <p><strong>Chave PIX:</strong> contato@qcsp333.gov.br</p>
      <p>Após o pagamento, envie o comprovante no WhatsApp.</p>
    </div>
  </div>

  <script>
    const PRECO_LIVRO = 45.00;
    const WHATSAPP_NUMERO = '5512991513554';
    const SHEET_MONKEY_URL = 'https://api.sheetmonkey.io/form/jPMBQbTa6pU2ZF2wRDQcuX';

    document.getElementById('btnCalcular').addEventListener('click', function() {
      const quantidade = parseInt(document.getElementById('quantidade').value) || 0;
      const frete = parseFloat(document.getElementById('frete').value) || 0;
      const totalLivros = quantidade * PRECO_LIVRO;
      const total = totalLivros + frete;
      const display = document.getElementById('display');
      display.innerHTML = `Quantidade de livros: ${quantidade}<br>Valor dos livros: R$ ${totalLivros.toFixed(2)}<br>Frete: R$ ${frete.toFixed(2)}<br><strong>Total: R$ ${total.toFixed(2)}</strong>`;
    });

    document.getElementById('btnWhatsApp').addEventListener('click', function() {
      const nome = document.getElementById('nome').value.trim();
      const endereco = document.getElementById('endereco').value.trim();
      const telefone = document.getElementById('telefone').value.trim();
      const quantidade = parseInt(document.getElementById('quantidade').value) || 0;
      const frete = parseFloat(document.getElementById('frete').value) || 0;
      const totalLivros = quantidade * PRECO_LIVRO;
      const total = totalLivros + frete;

      if (!nome || !endereco || !telefone) {
        alert('Preencha todos os campos obrigatórios: Nome, Endereço e Telefone.');
        return;
      }

      const mensagem = `Olá! Gostaria de fazer um pedido do livro Ars Regum Vol 4.\n\nNome: ${nome}\nEndereço: ${endereco}\nTelefone: ${telefone}\nQuantidade: ${quantidade}\nValor dos livros: R$ ${totalLivros.toFixed(2)}\nFrete: R$ ${frete.toFixed(2)}\nTotal: R$ ${total.toFixed(2)}`;

      const url = `https://wa.me/${WHATSAPP_NUMERO}?text=${encodeURIComponent(mensagem)}`;
      window.open(url, '_blank');
    });

    document.getElementById('btnPix').addEventListener('click', function() {
      const pixInfo = document.getElementById('pixInfo');
      pixInfo.style.display = pixInfo.style.display === 'none' ? 'block' : 'none';
    });

    // Sheet Monkey submission on form submit
    document.getElementById('pedidoForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = this;
      const data = new FormData(form);
      fetch(SHEET_MONKEY_URL, {
        method: 'POST',
        body: data
      })
      .then(response => {
        if (response.ok) {
          alert('Pedido registrado com sucesso! Entraremos em contato em breve.');
          form.reset();
        } else {
          alert('Erro ao registrar pedido. Tente novamente.');
        }
      })
      .catch(error => {
        console.error('Erro:', error);
        alert('Erro de conexão. Tente novamente.');
      });
    });
  </script>
</body>
</html>
